name: Fetch Latest Video

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:
  schedule:
    - cron: 0 */12 * * *

permissions:
  contents: write

concurrency:
  group: fetch-latest-video

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Fetch latest video ID
        run: |
          cd site
          id=$(curl -fsSL --retry 3 --max-time 20 "https://www.youtube.com/feeds/videos.xml?channel_id=UC4U1e34boXZ7cjYjqzf9osw" | grep -oE '<yt:videoId>[^<]+' | head -1 | cut -d'>' -f2)
          if [ -n "$id" ] && echo "$id" | grep -qE '^[A-Za-z0-9_-]{11}$'; then
            echo "$id" > LATEST_VIDEO_ID
          else
            echo "No video ID received; leaving LATEST_VIDEO_ID unchanged."
            exit 0
          fi

      - name: Commit and push if changed
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST_VIDEO_ID
          if ! git diff --staged --quiet; then
            git commit -m "Update latest video ID: $(cat LATEST_VIDEO_ID)"
            git push origin HEAD:gh-pages
          else
            echo "Latest video ID unchanged."
          fi
