name: Fetch Latest Video

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */12 * * *

permissions:
  contents: write

concurrency:
  group: fetch-latest-video

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: youtube-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Fetch latest video ID
        run: |
          cd site
          curl -fsS "https://www.googleapis.com/youtube/v3/playlistItems?playlistId=UU4U1e34boXZ7cjYjqzf9osw&part=contentDetails&maxResults=1&sort=date&key=${{ secrets.YOUTUBE_API_KEY }}" \
            | jq -r '.items[0].contentDetails.videoId' > LATEST_VIDEO_ID
          if ! grep -qE '^[A-Za-z0-9_-]{11}$' LATEST_VIDEO_ID; then
            echo "No valid video ID received; leaving LATEST_VIDEO_ID unchanged."
            exit 0
          fi

      - name: Commit and push if changed
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST_VIDEO_ID
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "Update latest video ID: $(cat LATEST_VIDEO_ID)"
            git push origin HEAD:gh-pages
          else
            echo "Latest video ID unchanged."
          fi
