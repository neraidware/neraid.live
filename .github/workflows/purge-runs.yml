name: Purge Old Workflow Runs

on:
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:
    inputs:
      keep:
        description: "Number of most recent runs to keep"
        required: false
        default: "6"
      workflow_id:
        description: "Workflow ID to purge"
        required: false
        default: "236417235"

permissions:
  actions: write

concurrency:
  group: purge-runs

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = parseInt(core.getInput('keep') || '6', 10);
            const wfId = core.getInput('workflow_id') || '236417235';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: wfId, per_page: 100 }
            );
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const doomed = runs.slice(keep);

            core.notice(`found ${runs.length} runs, keeping ${keep}, deleting ${doomed.length}`);

            let ok = 0;
            for (const r of doomed) {
              let done = false;
              for (let attempt = 1; attempt <= 3 && !done; attempt++) {
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                  ok++;
                  done = true;
                } catch (e) {
                  if (attempt === 3) {
                    core.warning(`run ${r.id}: ${e.message}`);
                  }
                  await new Promise((res) => setTimeout(res, attempt * 10000));
                }
              }
              await new Promise((res) => setTimeout(res, 400));
            }

            core.notice(`done: deleted ${ok}/${doomed.length}`);
          keep: ${{ inputs.keep }}
          workflow_id: ${{ inputs.workflow_id }}
