<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="res/styles/style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="res/icons/tie.png">
        <script src="https://embed.twitch.tv/embed/v1.js" defer></script>
        <script src="res/scripts/twitchStatus.js" defer></script>
        <title>neraid - the site</title>
    </head>
    <body>
        <nav id="topbar">
            <a href="/blog">Blog</a>
        </nav>
        <aside> 
            <span>
                <span>O vídeo mais</span>
                <span class="hottest-text">
                    <span class="gay-text">q</span>
                    <span class="gay-text">u</span>
                    <span class="gay-text">e</span>
                    <span class="gay-text">n</span>
                    <span class="gay-text">t</span>
                    <span class="gay-text">e</span>
                </span>
                <span> do momento!!</span>
            </span>
            <iframe id="latest_video_embed" width="560" height="315" src="https://www.youtube.com/embed/videoseries?listType=user_uploads&list=UC4U1e34boXZ7cjYjqzf9osw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <div id="twitch-status">
                <span class="twitch-pre">não estou em </span>
                <span class="live-text">
                    <span>l</span>
                    <span>i</span>
                    <span>v</span>
                    <span>e</span>
                </span>
                <span class="twitch-post"> agora</span>
            </div>
            <div id="twitch_embed"></div>
        </aside>
        <div id="interactive-gif">
            <div class="hovered">
                <img src="res/images/please_dont_hurt_me.png" alt="im innocent i swear">
            </div>
            <div class="unhovered">
                <img src="res/images/me.gif" alt="grovata">
            </div>
        </div>
        <main>
            <div id="socials">
                {{#social}}
                <div class="social-row">
                    <div class="hand">
                        <img src="{{hand}}" alt="">
                    </div>
                    <a class="social-button" target="_blank" href="{{url}}">
                        <div class="social-icon"><img src="{{icon_url}}"></div>
                        <span class="social-text">{{title}}</span>
                    </a>
                </div>
                {{/social}}
            </div>
        </main>
    </body>
</html>
