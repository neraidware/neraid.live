<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/res/styles/style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>blog - neraid</title>
    </head>
    <body>
        <nav id="topbar">
            <a href="/">Home</a>
            <a href="/blog">Blog</a>
        </nav>
        <main class="blog">
            <h1 class="blog-title">blog</h1>
            <ul class="blog-list">
                {{#entries}}
                <li>
                    <a href="{{url}}">
                        <span class="blog-date">{{date}}</span>
                        <span class="blog-entry-title">{{title}}</span>
                    </a>
                </li>
                {{/entries}}
            </ul>
        </main>
    </body>
</html>
